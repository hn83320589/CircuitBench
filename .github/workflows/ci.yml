name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore CircuitBench.sln

      - name: Build
        run: dotnet build CircuitBench.sln -c Release --no-restore

      - name: Test
        run: dotnet test CircuitBench.sln -c Release --no-build --filter "Category!=Performance" --logger "trx" --results-directory TestResults

      - name: Performance tests (informational)
        continue-on-error: true
        run: dotnet test tests/CircuitBench.Performance.Tests -c Release --no-build --filter "Category=Performance" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish win-x64
        run: dotnet publish src/CircuitBench.App/CircuitBench.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircuitBench-win-x64
          path: publish/win-x64
